    <!-- JavaScript for Role Card Toggle -->
    <script>
        function toggleRoleCard(label, color) {
            const checkbox = label.querySelector('input[type="checkbox"]');
            const card = label.querySelector('.role-card');
            const checkBox = label.querySelector('.check-box');
            const checkIcon = label.querySelector('.check-icon');

            // Use setTimeout to ensure the checkbox state has been updated
            setTimeout(() => {
                const isChecked = checkbox.checked;

                const colorMap = {
                    'blue': { border: 'border-blue-500', bg: 'bg-blue-500/10', boxBorder: 'border-blue-500', boxBg: 'bg-blue-500' },
                    'pink': { border: 'border-pink-500', bg: 'bg-pink-500/10', boxBorder: 'border-pink-500', boxBg: 'bg-pink-500' },
                    'amber': { border: 'border-amber-500', bg: 'bg-amber-500/10', boxBorder: 'border-amber-500', boxBg: 'bg-amber-500' }
                };

                const colors = colorMap[color];

                if (isChecked) {
                    // Add checked styles
                    card.classList.remove('border-slate-700');
                    card.classList.add(colors.border, colors.bg);
                    checkBox.classList.remove('border-slate-600');
                    checkBox.classList.add(colors.boxBorder, colors.boxBg);
                    checkIcon.classList.remove('hidden');
                } else {
                    // Remove checked styles
                    card.classList.add('border-slate-700');
                    card.classList.remove(colors.border, colors.bg);
                    checkBox.classList.add('border-slate-600');
                    checkBox.classList.remove(colors.boxBorder, colors.boxBg);
                    checkIcon.classList.add('hidden');
                }
            }, 0);
        }
    </script>
