<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일 인증 - MatchUp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #818CF8 0%, #C084FC 50%, #F472B6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen">
    <!-- Navigation -->
    <nav class="border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="../home/index.html" class="text-2xl font-bold gradient-text">MatchUp</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            <!-- Verify Email Card -->
            <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-8 text-center">
                <!-- Email Icon -->
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-r from-indigo-500/20 to-purple-500/20 mb-6">
                    <svg class="w-10 h-10 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>

                <!-- Header -->
                <h1 class="text-2xl font-bold text-white mb-2">이메일을 확인하세요</h1>
                <p class="text-slate-400 mb-6">
                    <span class="text-white font-medium">user@example.com</span>으로<br>
                    인증 링크를 보냈습니다.
                </p>

                <!-- Instructions -->
                <div class="bg-slate-800/50 rounded-lg p-4 mb-6 text-left">
                    <p class="text-sm text-slate-400">
                        이메일의 인증 링크를 클릭하여 계정을 활성화하세요.
                        이메일이 보이지 않는다면 스팸 폴더를 확인해주세요.
                    </p>
                </div>

                <!-- Actions -->
                <div class="space-y-3">
                    <button class="w-full py-3 px-4 border border-slate-700 rounded-lg text-white font-medium hover:bg-slate-800 transition-colors">
                        인증 메일 다시 보내기
                    </button>

                    <a
                        href="../onboarding/intro.html"
                        class="block w-full py-3 px-4 bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-semibold rounded-lg hover:from-indigo-600 hover:to-purple-600 transition-all text-center"
                    >
                        인증 완료 후 계속하기
                    </a>
                </div>

                <!-- Timer -->
                <p class="mt-4 text-sm text-slate-500">
                    인증 메일은 <span class="text-indigo-400">5분</span> 후에 다시 보낼 수 있습니다.
                </p>
            </div>

            <!-- Help -->
            <div class="mt-6 text-center">
                <p class="text-slate-400 text-sm">
                    문제가 있으신가요?
                    <a href="../support/contact.html" class="text-indigo-400 hover:text-indigo-300">
                        고객센터에 문의하세요
                    </a>
                </p>
            </div>

            <!-- Change Email -->
            <p class="text-center mt-4 text-slate-500 text-sm">
                이메일 주소가 잘못되었나요?
                <a href="signup.html" class="text-indigo-400 hover:text-indigo-300">
                    다시 가입하기
                </a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <p class="text-slate-500 text-sm">
                    &copy; 2024 MatchUp. All rights reserved.
                </p>
                <div class="flex gap-6">
                    <a href="../legal/terms.html" class="text-slate-500 hover:text-slate-400 text-sm">
                        이용약관
                    </a>
                    <a href="../legal/privacy.html" class="text-slate-500 hover:text-slate-400 text-sm">
                        개인정보처리방침
                    </a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
