<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - MatchUp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #818CF8 0%, #C084FC 50%, #F472B6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen">
    <!-- Navigation -->
    <nav class="border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="../home/index.html" class="text-2xl font-bold gradient-text">MatchUp</a>
                <a href="signup.html" class="text-slate-400 hover:text-white transition-colors">
                    회원가입
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white mb-2">다시 만나서 반갑습니다</h1>
                <p class="text-slate-400">계정에 로그인하세요</p>
            </div>

            <!-- Login Card -->
            <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-8">
                <!-- Social Login Buttons -->
                <div class="space-y-3 mb-6">
                    <button class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-slate-700 rounded-lg hover:bg-slate-800 transition-colors">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#EA4335" d="M5.26620003,9.76452941 C6.19878754,6.93863203 8.85444915,4.90909091 12,4.90909091 C13.6909091,4.90909091 15.2181818,5.50909091 16.4181818,6.49090909 L19.9090909,3 C17.7818182,1.14545455 15.0545455,0 12,0 C7.27006974,0 3.1977497,2.69829785 1.23999023,6.65002441 L5.26620003,9.76452941 Z"/>
                            <path fill="#34A853" d="M16.0407269,18.0125889 C14.9509167,18.7163016 13.5660892,19.0909091 12,19.0909091 C8.86648613,19.0909091 6.21911939,17.076871 5.27698177,14.2678769 L1.23746264,17.3349879 C3.19279051,21.2936293 7.26500293,24 12,24 C14.9328362,24 17.7353462,22.9573905 19.834192,20.9995801 L16.0407269,18.0125889 Z"/>
                            <path fill="#4A90E2" d="M19.834192,20.9995801 C22.0291676,18.9520994 23.4545455,15.903663 23.4545455,12 C23.4545455,11.2909091 23.3454545,10.5272727 23.1818182,9.81818182 L12,9.81818182 L12,14.4545455 L18.4363636,14.4545455 C18.1187732,16.013626 17.2662994,17.2212117 16.0407269,18.0125889 L19.834192,20.9995801 Z"/>
                            <path fill="#FBBC05" d="M5.27698177,14.2678769 C5.03832634,13.556323 4.90909091,12.7937589 4.90909091,12 C4.90909091,11.2182781 5.03443647,10.4668121 5.26620003,9.76452941 L1.23999023,6.65002441 C0.43658717,8.26043162 0,10.0753848 0,12 C0,13.9195484 0.444780743,15.7## L1.23746264,17.3349879 L5.27698177,14.2678769 Z"/>
                        </svg>
                        <span class="text-white font-medium">Google로 계속하기</span>
                    </button>

                    <button class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-slate-700 rounded-lg hover:bg-slate-800 transition-colors">
                        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                        <span class="text-white font-medium">GitHub로 계속하기</span>
                    </button>

                    <button class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-slate-700 rounded-lg hover:bg-slate-800 transition-colors">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#FEE500" d="M12 3c5.799 0 10.5 3.664 10.5 8.185 0 4.52-4.701 8.184-10.5 8.184a13.5 13.5 0 0 1-1.727-.11l-4.408 2.883c-.501.265-.678.236-.472-.413l.892-3.678c-2.88-1.46-4.785-3.99-4.785-6.866C1.5 6.665 6.201 3 12 3z"/>
                        </svg>
                        <span class="text-slate-900 font-medium">Kakao로 계속하기</span>
                    </button>
                </div>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-700"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-slate-900 text-slate-500">또는</span>
                    </div>
                </div>

                <!-- Email Login Form -->
                <form class="space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-400 mb-2">
                            이메일
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="name@example.com"
                            class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        >
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label for="password" class="block text-sm font-medium text-slate-400">
                                비밀번호
                            </label>
                            <a href="forgot-password.html" class="text-sm text-indigo-400 hover:text-indigo-300">
                                비밀번호를 잊으셨나요?
                            </a>
                        </div>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        >
                    </div>

                    <div class="flex items-center">
                        <input
                            type="checkbox"
                            id="remember"
                            name="remember"
                            class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-indigo-500 focus:ring-indigo-500"
                        >
                        <label for="remember" class="ml-2 text-sm text-slate-400">
                            로그인 상태 유지
                        </label>
                    </div>

                    <button
                        type="submit"
                        id="login-btn"
                        class="w-full py-3 px-4 bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-semibold rounded-lg hover:from-indigo-600 hover:to-purple-600 transition-all"
                    >
                        로그인
                    </button>
                </form>

                <!-- Error Message -->
                <div id="error-message" class="hidden mt-4 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-400 text-sm"></div>
            </div>

            <!-- Sign Up Link -->
            <p class="text-center mt-6 text-slate-400">
                아직 계정이 없으신가요?
                <a href="signup.html" class="text-indigo-400 hover:text-indigo-300 font-medium">
                    회원가입
                </a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <p class="text-slate-500 text-sm">
                    &copy; 2024 MatchUp. All rights reserved.
                </p>
                <div class="flex gap-6">
                    <a href="../legal/terms.html" class="text-slate-500 hover:text-slate-400 text-sm">
                        이용약관
                    </a>
                    <a href="../legal/privacy.html" class="text-slate-500 hover:text-slate-400 text-sm">
                        개인정보처리방침
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase 클라이언트 초기화
        const SUPABASE_URL = 'https://jgfmobrojsvmgkhoidvx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnZm1vYnJvanN2bWdraG9pZHZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM0NTQ4NzcsImV4cCI6MjA3OTAzMDg3N30.yrwocNV9xmUAn6sX52WRp7iIZ6gTqqVNNzukZLgPQXg';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 폼 요소들
        const loginForm = document.querySelector('form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const errorMessage = document.getElementById('error-message');

        // 에러 메시지 표시
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        // 에러 메시지 숨기기
        function hideError() {
            errorMessage.classList.add('hidden');
        }

        // 로그인 처리
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError('이메일과 비밀번호를 입력해주세요.');
                return;
            }

            // 버튼 로딩 상태
            loginBtn.disabled = true;
            loginBtn.textContent = '로그인 중...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    throw error;
                }

                // 로그인 성공 - 프로필 페이지로 이동
                window.location.href = '/pages/profile/index.html';

            } catch (error) {
                console.error('Login error:', error);

                // 에러 메시지 한글화
                let errorMsg = '로그인에 실패했습니다.';
                if (error.message.includes('Invalid login credentials')) {
                    errorMsg = '이메일 또는 비밀번호가 올바르지 않습니다.';
                } else if (error.message.includes('Email not confirmed')) {
                    errorMsg = '이메일 인증이 필요합니다.';
                } else if (error.message.includes('Too many requests')) {
                    errorMsg = '너무 많은 시도가 있었습니다. 잠시 후 다시 시도해주세요.';
                }

                showError(errorMsg);
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '로그인';
            }
        });

        // 이미 로그인된 경우 리다이렉트
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                window.location.href = '/pages/profile/index.html';
            }
        });
    </script>
</body>
</html>
