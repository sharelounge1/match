<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포트폴리오 수정 - MatchUp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #818CF8 0%, #C084FC 50%, #F472B6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full bg-slate-950/80 backdrop-blur-lg z-50 border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/pages/home/index.html" class="text-2xl font-bold">
                <span class="gradient-text">MatchUp</span>
            </a>
            <div class="hidden md:flex items-center space-x-8">
                <a href="/pages/explore/index.html" class="text-slate-400 hover:text-white transition">프로젝트 탐색</a>
                <a href="/pages/my-projects/index.html" class="text-slate-400 hover:text-white transition">내 프로젝트</a>
                <a href="/pages/messages/index.html" class="text-slate-400 hover:text-white transition">메시지</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/pages/notifications/index.html" class="text-slate-400 hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                    </svg>
                </a>
                <div class="w-8 h-8 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-24 pb-12 px-6">
        <div class="max-w-2xl mx-auto">
            <!-- Header -->
            <div class="mb-8">
                <a href="portfolio.html" class="text-slate-400 hover:text-white transition text-sm mb-4 inline-flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    포트폴리오 관리로 돌아가기
                </a>
                <h1 class="text-2xl md:text-3xl font-bold">포트폴리오 수정</h1>
            </div>

            <!-- Form -->
            <form class="space-y-6">
                <!-- Title -->
                <div class="bg-slate-900/50 rounded-2xl p-6 border border-slate-800">
                    <h2 class="text-lg font-semibold mb-4">기본 정보</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-slate-400 mb-2">프로젝트 제목 *</label>
                            <input type="text" value="AI 챗봇 서비스" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-2">프로젝트 설명 *</label>
                            <textarea rows="4" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition resize-none">24시간 고객 응대가 가능한 AI 기반 챗봇 서비스를 개발했습니다. 자연어 처리와 머신러닝을 활용하여 사용자 질문에 자동으로 응답합니다.</textarea>
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-2">프로젝트 링크</label>
                            <input type="url" value="https://github.com/jihoon-kim/ai-chatbot" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                            <p class="text-slate-500 text-xs mt-1">GitHub, 배포 URL 또는 관련 링크</p>
                        </div>
                    </div>
                </div>

                <!-- Image Upload -->
                <div class="bg-slate-900/50 rounded-2xl p-6 border border-slate-800">
                    <h2 class="text-lg font-semibold mb-4">프로젝트 이미지</h2>
                    <!-- Current Image -->
                    <div class="mb-4">
                        <div class="aspect-video bg-slate-800 rounded-lg relative">
                            <div class="absolute inset-0 flex items-center justify-center text-slate-500">
                                현재 이미지
                            </div>
                            <button type="button" class="absolute top-3 right-3 p-2 bg-red-500/80 rounded-lg hover:bg-red-500 transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <!-- Upload Area -->
                    <div class="border-2 border-dashed border-slate-700 rounded-xl p-6 text-center hover:border-indigo-500/50 transition cursor-pointer">
                        <svg class="w-8 h-8 text-slate-600 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <p class="text-slate-400 text-sm">새 이미지 업로드</p>
                        <input type="file" class="hidden" accept="image/*">
                    </div>
                </div>

                <!-- Tech Stack -->
                <div class="bg-slate-900/50 rounded-2xl p-6 border border-slate-800">
                    <h2 class="text-lg font-semibold mb-4">기술 스택</h2>
                    <div class="mb-4">
                        <input type="text" placeholder="기술 스택을 입력하고 Enter를 누르세요" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <span class="inline-flex items-center gap-2 px-3 py-1 bg-slate-800 text-slate-300 text-sm rounded-full">
                            Python
                            <button type="button" class="text-slate-500 hover:text-white transition">&times;</button>
                        </span>
                        <span class="inline-flex items-center gap-2 px-3 py-1 bg-slate-800 text-slate-300 text-sm rounded-full">
                            TensorFlow
                            <button type="button" class="text-slate-500 hover:text-white transition">&times;</button>
                        </span>
                        <span class="inline-flex items-center gap-2 px-3 py-1 bg-slate-800 text-slate-300 text-sm rounded-full">
                            React
                            <button type="button" class="text-slate-500 hover:text-white transition">&times;</button>
                        </span>
                    </div>
                </div>

                <!-- Completion Date -->
                <div class="bg-slate-900/50 rounded-2xl p-6 border border-slate-800">
                    <h2 class="text-lg font-semibold mb-4">완료 날짜</h2>
                    <div>
                        <input type="month" value="2024-08" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                        <p class="text-slate-500 text-xs mt-1">프로젝트를 완료한 대략적인 날짜</p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row gap-4">
                    <button type="submit" class="flex-1 bg-gradient-to-r from-indigo-500 to-purple-500 text-white px-6 py-3 rounded-lg hover:opacity-90 transition font-medium">
                        변경사항 저장
                    </button>
                    <a href="portfolio.html" class="flex-1 text-center border border-slate-700 text-white px-6 py-3 rounded-lg hover:bg-slate-800 transition font-medium">
                        취소
                    </a>
                </div>

                <!-- Delete Button -->
                <div class="pt-6 border-t border-slate-800">
                    <button type="button" class="w-full text-red-400 hover:text-red-300 hover:bg-red-500/10 px-6 py-3 rounded-lg transition font-medium">
                        이 포트폴리오 삭제
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-8 px-6 border-t border-slate-800">
        <div class="max-w-6xl mx-auto">
            <div class="flex flex-col md:flex-row items-center justify-between">
                <div class="text-xl font-bold gradient-text mb-4 md:mb-0">MatchUp</div>
                <div class="flex items-center space-x-6 text-sm text-slate-500">
                    <a href="/pages/legal/terms.html" class="hover:text-white transition">이용약관</a>
                    <a href="/pages/legal/privacy.html" class="hover:text-white transition">개인정보처리방침</a>
                    <a href="/pages/support/contact.html" class="hover:text-white transition">문의하기</a>
                </div>
            </div>
            <div class="text-center text-sm text-slate-600 mt-8">
                &copy; 2025 MatchUp. All rights reserved.
            </div>
        </div>
    </footer>
</body>
</html>
