<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미팅룸 - MatchUp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #818CF8 0%, #C084FC 50%, #F472B6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #6366F1 0%, #A855F7 100%);
        }
    </style>
</head>
<body class="bg-slate-950 h-screen overflow-hidden">
    <!-- Top Bar -->
    <header class="bg-slate-900/80 backdrop-blur-sm border-b border-slate-800 h-14">
        <div class="h-full px-4 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <a href="/pages/meetings/index.html" class="text-xl font-bold gradient-text">MatchUp</a>
                <div class="hidden sm:block h-6 w-px bg-slate-700"></div>
                <div class="hidden sm:block">
                    <h1 class="text-white font-medium text-sm">AI 운동 추천 앱 - 첫 미팅</h1>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <!-- Meeting Timer -->
                <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-lg">
                    <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>
                    <span class="text-white text-sm font-mono">00:15:32</span>
                </div>
                <!-- Meeting Info -->
                <button class="text-slate-400 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex h-[calc(100vh-3.5rem-4.5rem)]">
        <!-- Video Area -->
        <div class="flex-1 p-4 flex flex-col">
            <!-- Main Video -->
            <div class="flex-1 bg-slate-900 rounded-xl relative overflow-hidden">
                <!-- Video Placeholder -->
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="text-center">
                        <div class="w-24 h-24 rounded-full bg-blue-500 flex items-center justify-center text-white text-3xl font-bold mb-4 mx-auto">
                            K
                        </div>
                        <p class="text-white font-medium">김민수</p>
                        <p class="text-slate-400 text-sm">발표 중</p>
                    </div>
                </div>

                <!-- Speaker Indicator -->
                <div class="absolute top-4 left-4 flex items-center space-x-2 bg-slate-800/80 backdrop-blur-sm px-3 py-1.5 rounded-lg">
                    <svg class="w-4 h-4 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z" clip-rule="evenodd"></path>
                    </svg>
                    <span class="text-white text-sm">김민수</span>
                </div>

                <!-- Small Self Video -->
                <div class="absolute bottom-4 right-4 w-48 h-36 bg-slate-800 rounded-lg overflow-hidden border-2 border-slate-700">
                    <div class="w-full h-full flex items-center justify-center">
                        <div class="text-center">
                            <div class="w-12 h-12 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 flex items-center justify-center text-white text-sm font-bold mx-auto">
                                나
                            </div>
                        </div>
                    </div>
                    <!-- Mute indicator -->
                    <div class="absolute bottom-2 right-2 bg-red-500/80 rounded-full p-1">
                        <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Participant Thumbnails -->
            <div class="flex items-center justify-center space-x-3 mt-4">
                <div class="w-20 h-16 bg-slate-800 rounded-lg overflow-hidden border-2 border-indigo-500 relative">
                    <div class="w-full h-full flex items-center justify-center">
                        <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white text-xs font-bold">K</div>
                    </div>
                    <div class="absolute bottom-1 left-1 bg-green-500 rounded-full p-0.5">
                        <svg class="w-2 h-2 text-white" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                </div>
                <div class="w-20 h-16 bg-slate-800 rounded-lg overflow-hidden border-2 border-slate-700 relative">
                    <div class="w-full h-full flex items-center justify-center">
                        <div class="w-8 h-8 rounded-full bg-purple-500 flex items-center justify-center text-white text-xs font-bold">J</div>
                    </div>
                </div>
                <div class="w-20 h-16 bg-slate-800 rounded-lg overflow-hidden border-2 border-slate-700 relative">
                    <div class="w-full h-full flex items-center justify-center">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 flex items-center justify-center text-white text-xs font-bold">나</div>
                    </div>
                    <div class="absolute bottom-1 right-1 bg-red-500 rounded-full p-0.5">
                        <svg class="w-2 h-2 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Side Panel (Chat & Participants) -->
        <div class="hidden lg:flex w-80 bg-slate-900/50 border-l border-slate-800 flex-col">
            <!-- Panel Tabs -->
            <div class="flex border-b border-slate-800">
                <button class="flex-1 px-4 py-3 text-white text-sm font-medium border-b-2 border-indigo-500">
                    채팅
                </button>
                <button class="flex-1 px-4 py-3 text-slate-400 text-sm font-medium hover:text-white transition-colors">
                    참여자 (3)
                </button>
            </div>

            <!-- Chat Messages -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- System Message -->
                <div class="text-center">
                    <span class="text-slate-500 text-xs">미팅이 시작되었습니다</span>
                </div>

                <!-- Chat Message 1 -->
                <div class="flex items-start space-x-2">
                    <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">K</div>
                    <div>
                        <div class="flex items-baseline space-x-2">
                            <span class="text-white text-sm font-medium">김민수</span>
                            <span class="text-slate-500 text-xs">14:02</span>
                        </div>
                        <p class="text-slate-300 text-sm mt-1">안녕하세요! 오늘 미팅 시작하겠습니다.</p>
                    </div>
                </div>

                <!-- Chat Message 2 -->
                <div class="flex items-start space-x-2">
                    <div class="w-8 h-8 rounded-full bg-purple-500 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">J</div>
                    <div>
                        <div class="flex items-baseline space-x-2">
                            <span class="text-white text-sm font-medium">정유진</span>
                            <span class="text-slate-500 text-xs">14:03</span>
                        </div>
                        <p class="text-slate-300 text-sm mt-1">네, 반갑습니다!</p>
                    </div>
                </div>

                <!-- Chat Message 3 -->
                <div class="flex items-start space-x-2">
                    <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">K</div>
                    <div>
                        <div class="flex items-baseline space-x-2">
                            <span class="text-white text-sm font-medium">김민수</span>
                            <span class="text-slate-500 text-xs">14:05</span>
                        </div>
                        <p class="text-slate-300 text-sm mt-1">먼저 프로젝트 방향성에 대해 얘기해볼까요?</p>
                    </div>
                </div>

                <!-- Chat Message 4 (My message) -->
                <div class="flex items-start space-x-2 justify-end">
                    <div class="bg-indigo-500/20 rounded-lg p-3 max-w-[80%]">
                        <div class="flex items-baseline space-x-2 justify-end">
                            <span class="text-slate-500 text-xs">14:10</span>
                            <span class="text-white text-sm font-medium">나</span>
                        </div>
                        <p class="text-slate-300 text-sm mt-1">좋습니다. 제가 준비한 자료 화면 공유 드릴게요.</p>
                    </div>
                </div>

                <!-- Chat Message 5 -->
                <div class="flex items-start space-x-2">
                    <div class="w-8 h-8 rounded-full bg-purple-500 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">J</div>
                    <div>
                        <div class="flex items-baseline space-x-2">
                            <span class="text-white text-sm font-medium">정유진</span>
                            <span class="text-slate-500 text-xs">14:12</span>
                        </div>
                        <p class="text-slate-300 text-sm mt-1">백엔드 아키텍처는 제가 정리해서 공유 드리겠습니다.</p>
                    </div>
                </div>
            </div>

            <!-- Chat Input -->
            <div class="p-4 border-t border-slate-800">
                <div class="flex items-center space-x-2">
                    <input
                        type="text"
                        class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm"
                        placeholder="메시지를 입력하세요..."
                    >
                    <button class="p-2 gradient-bg rounded-lg hover:opacity-90 transition-opacity">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Control Bar -->
    <div class="h-[4.5rem] bg-slate-900 border-t border-slate-800 flex items-center justify-center px-4">
        <div class="flex items-center space-x-3">
            <!-- Microphone -->
            <button class="w-12 h-12 rounded-full bg-red-500 text-white flex items-center justify-center hover:bg-red-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
                </svg>
            </button>

            <!-- Camera -->
            <button class="w-12 h-12 rounded-full bg-slate-700 text-white flex items-center justify-center hover:bg-slate-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
            </button>

            <!-- Screen Share -->
            <button class="w-12 h-12 rounded-full bg-slate-700 text-white flex items-center justify-center hover:bg-slate-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
            </button>

            <!-- Chat Toggle (Mobile) -->
            <button class="w-12 h-12 rounded-full bg-slate-700 text-white flex items-center justify-center hover:bg-slate-600 transition-colors lg:hidden">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                </svg>
            </button>

            <!-- Participants -->
            <button class="w-12 h-12 rounded-full bg-slate-700 text-white flex items-center justify-center hover:bg-slate-600 transition-colors relative">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                <span class="absolute -top-1 -right-1 w-5 h-5 bg-indigo-500 rounded-full text-xs flex items-center justify-center">3</span>
            </button>

            <!-- More Options -->
            <button class="w-12 h-12 rounded-full bg-slate-700 text-white flex items-center justify-center hover:bg-slate-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"></path>
                </svg>
            </button>

            <div class="w-px h-8 bg-slate-700 mx-2"></div>

            <!-- End Call -->
            <button class="px-6 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors font-medium flex items-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z"></path>
                </svg>
                <span>종료</span>
            </button>
        </div>
    </div>
</body>
</html>
