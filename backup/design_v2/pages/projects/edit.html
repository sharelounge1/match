<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 수정 - MatchUp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #818CF8 0%, #C084FC 50%, #F472B6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .glow-card:hover {
            box-shadow: 0 0 30px rgba(129, 140, 248, 0.3);
        }
    </style>
</head>
<body class="bg-slate-950 text-white">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full bg-slate-950/80 backdrop-blur-lg z-50 border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="text-2xl font-bold">
                <a href="../../index.html" class="gradient-text">MatchUp</a>
            </div>
            <div class="hidden md:flex items-center space-x-8">
                <a href="../explore/index.html" class="text-slate-400 hover:text-white transition">프로젝트</a>
                <a href="../my-projects/posted.html" class="text-slate-400 hover:text-white transition">내 프로젝트</a>
                <a href="../messages/index.html" class="text-slate-400 hover:text-white transition">메시지</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="../notifications/index.html" class="text-slate-400 hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                    </svg>
                </a>
                <a href="../profile/index.html" class="w-8 h-8 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full"></a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-24 pb-16 px-6">
        <div class="max-w-3xl mx-auto">
            <!-- Header -->
            <div class="mb-8">
                <div class="flex items-center gap-2 text-sm text-slate-400 mb-4">
                    <a href="../my-projects/posted.html" class="hover:text-white transition">내 프로젝트</a>
                    <span>/</span>
                    <span class="text-white">수정</span>
                </div>
                <h1 class="text-3xl font-bold mb-2">프로젝트 수정</h1>
                <p class="text-slate-400">프로젝트 정보를 수정할 수 있습니다</p>
            </div>

            <!-- Basic Info -->
            <div class="bg-slate-900/50 rounded-2xl p-6 border border-slate-800 mb-6">
                <h2 class="text-xl font-semibold mb-6">기본 정보</h2>
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium mb-2">프로젝트 제목 <span class="text-red-400">*</span></label>
                        <input type="text" value="AI 기반 운동 추천 서비스" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">카테고리</label>
                            <select class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition">
                                <option value="app" selected>앱</option>
                                <option value="web">웹</option>
                                <option value="ai">AI/ML</option>
                                <option value="game">게임</option>
                                <option value="ecommerce">이커머스</option>
                                <option value="fintech">핀테크</option>
                                <option value="healthcare">헬스케어</option>
                                <option value="education">교육</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">프로젝트 단계</label>
                            <select class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition">
                                <option value="idea" selected>아이디어</option>
                                <option value="mvp">MVP</option>
                                <option value="beta">베타</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">한 줄 소개</label>
                        <input type="text" value="개인 맞춤형 운동 프로그램을 AI가 추천해주는 서비스" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                    </div>
                </div>
            </div>

            <!-- Description -->
            <div class="bg-slate-900/50 rounded-2xl p-6 border border-slate-800 mb-6">
                <h2 class="text-xl font-semibold mb-6">상세 설명</h2>
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium mb-2">프로젝트 설명</label>
                        <textarea rows="4" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition resize-none">개인의 체형, 건강 상태, 운동 목표에 맞춰 AI가 최적의 운동 프로그램을 추천해주는 서비스입니다. 기존 피트니스 앱들이 일률적인 프로그램만 제공하는 것과 달리, 사용자의 피드백을 학습하여 지속적으로 개선되는 맞춤형 추천 시스템을 구축하려고 합니다.</textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">해결하려는 문제</label>
                        <textarea rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition resize-none">- 운동 초보자들이 자신에게 맞는 운동을 찾기 어려움
- 개인 트레이너 비용이 부담스러운 사용자층 존재
- 일반적인 운동 앱은 개인화가 부족함</textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">제안하는 솔루션</label>
                        <textarea rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition resize-none">- 사용자 데이터 기반 AI 추천 알고리즘 개발
- 운동 수행 피드백을 통한 지속적인 학습
- 건강 기기(웨어러블) 연동으로 정확도 향상</textarea>
                    </div>
                </div>
            </div>

            <!-- Role Recruitment -->
            <div class="bg-slate-900/50 rounded-2xl p-6 border border-slate-800 mb-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-semibold">모집 역할</h2>
                    <button class="text-sm text-indigo-400 hover:text-indigo-300 transition">+ 역할 추가</button>
                </div>
                <div class="space-y-4">
                    <!-- Role 1: Developer -->
                    <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-700">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-3">
                                <span class="w-3 h-3 bg-blue-500 rounded-full"></span>
                                <span class="font-medium">풀스택 개발자</span>
                            </div>
                            <button class="text-slate-400 hover:text-red-400 transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                            </button>
                        </div>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-sm text-slate-400 mb-1">필요 스킬</label>
                                <input type="text" value="React Native, Node.js, Python" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="flex-1">
                                    <label class="block text-sm text-slate-400 mb-1">지분</label>
                                    <div class="flex items-center gap-2">
                                        <input type="number" value="40" class="w-16 bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white text-center text-sm focus:outline-none focus:border-indigo-500">
                                        <span class="text-slate-400 text-sm">%</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Role 2: Designer -->
                    <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-700">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-3">
                                <span class="w-3 h-3 bg-pink-500 rounded-full"></span>
                                <span class="font-medium">UI/UX 디자이너</span>
                            </div>
                            <button class="text-slate-400 hover:text-red-400 transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                            </button>
                        </div>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-sm text-slate-400 mb-1">필요 스킬</label>
                                <input type="text" value="Figma, 앱 디자인" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="flex-1">
                                    <label class="block text-sm text-slate-400 mb-1">지분</label>
                                    <div class="flex items-center gap-2">
                                        <input type="number" value="20" class="w-16 bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white text-center text-sm focus:outline-none focus:border-indigo-500">
                                        <span class="text-slate-400 text-sm">%</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings -->
            <div class="bg-slate-900/50 rounded-2xl p-6 border border-slate-800 mb-6">
                <h2 class="text-xl font-semibold mb-6">프로젝트 설정</h2>
                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">예상 기간</label>
                            <select class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition">
                                <option value="1-3">1-3개월</option>
                                <option value="3-6" selected>3-6개월</option>
                                <option value="6-12">6-12개월</option>
                                <option value="12+">12개월 이상</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">지원 마감일</label>
                            <input type="date" value="2025-02-15" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">프로젝트 상태</label>
                        <select class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition">
                            <option value="active" selected>모집 중</option>
                            <option value="paused">일시 중지</option>
                            <option value="closed">모집 마감</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-between">
                <button class="px-6 py-3 text-red-400 hover:text-red-300 transition">
                    프로젝트 삭제
                </button>
                <div class="flex gap-3">
                    <a href="../my-projects/posted.html" class="px-6 py-3 border border-slate-700 rounded-lg text-slate-300 hover:bg-slate-800 transition">
                        취소
                    </a>
                    <button class="px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-lg font-medium hover:opacity-90 transition">
                        변경사항 저장
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-12 px-6 border-t border-slate-800">
        <div class="max-w-6xl mx-auto">
            <div class="flex flex-col md:flex-row items-center justify-between">
                <div class="text-xl font-bold gradient-text mb-4 md:mb-0">MatchUp</div>
                <div class="flex items-center space-x-6 text-sm text-slate-500">
                    <a href="../legal/terms.html" class="hover:text-white transition">이용약관</a>
                    <a href="../legal/privacy.html" class="hover:text-white transition">개인정보처리방침</a>
                    <a href="../support/contact.html" class="hover:text-white transition">문의하기</a>
                </div>
            </div>
            <div class="text-center text-sm text-slate-600 mt-8">
                &copy; 2025 MatchUp. All rights reserved.
            </div>
        </div>
    </footer>
</body>
</html>
