<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchUp - 새 계약서 작성</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #818CF8 0%, #C084FC 50%, #F472B6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .glow-card:hover {
            box-shadow: 0 0 30px rgba(129, 140, 248, 0.3);
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full bg-slate-950/80 backdrop-blur-lg z-50 border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="text-2xl font-bold">
                <span class="gradient-text">MatchUp</span>
            </div>
            <div class="hidden md:flex items-center space-x-8">
                <a href="#" class="text-slate-400 hover:text-white transition">프로젝트</a>
                <a href="index.html" class="text-white font-medium">계약서</a>
                <a href="../payments/index.html" class="text-slate-400 hover:text-white transition">결제</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="#" class="text-slate-400 hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                    </svg>
                </a>
                <div class="w-8 h-8 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-24 pb-12 px-6">
        <div class="max-w-4xl mx-auto">
            <!-- Back Button -->
            <a href="index.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition mb-6">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                계약서 목록으로
            </a>

            <!-- Header -->
            <div class="mb-8">
                <h1 class="text-3xl font-bold mb-2">새 계약서 작성</h1>
                <p class="text-slate-400">프로젝트 협업을 위한 계약서를 작성하세요</p>
            </div>

            <!-- Template Selection -->
            <div class="bg-slate-900/50 rounded-xl p-6 border border-slate-800 mb-6">
                <h2 class="text-lg font-semibold mb-4">템플릿 선택</h2>
                <div class="grid md:grid-cols-3 gap-4">
                    <div class="p-4 border-2 border-indigo-500 rounded-lg bg-indigo-500/10 cursor-pointer">
                        <div class="text-indigo-400 mb-2">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </div>
                        <h3 class="font-medium mb-1">기본 협업 계약서</h3>
                        <p class="text-sm text-slate-400">지분/수익 배분 기본 템플릿</p>
                    </div>
                    <div class="p-4 border border-slate-700 rounded-lg hover:border-slate-600 cursor-pointer transition">
                        <div class="text-slate-400 mb-2">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <h3 class="font-medium mb-1">수익 공유 계약서</h3>
                        <p class="text-sm text-slate-400">수익 배분 중심 템플릿</p>
                    </div>
                    <div class="p-4 border border-slate-700 rounded-lg hover:border-slate-600 cursor-pointer transition">
                        <div class="text-slate-400 mb-2">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                        </div>
                        <h3 class="font-medium mb-1">스타트업 공동창업</h3>
                        <p class="text-sm text-slate-400">법인 설립 전 템플릿</p>
                    </div>
                </div>
            </div>

            <!-- Party Selection -->
            <div class="bg-slate-900/50 rounded-xl p-6 border border-slate-800 mb-6">
                <h2 class="text-lg font-semibold mb-4">계약 당사자</h2>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-2">갑 (프로젝트 소유자)</label>
                        <div class="p-4 bg-slate-800/50 rounded-lg">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full flex items-center justify-center text-sm font-medium">
                                    나
                                </div>
                                <div>
                                    <div class="font-medium">나 (본인)</div>
                                    <div class="text-sm text-slate-400">아이디어 보유자</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-2">을 (협업 파트너)</label>
                        <select class="w-full p-4 bg-slate-800/50 rounded-lg border border-slate-700 text-white focus:border-indigo-500 focus:outline-none">
                            <option value="">파트너 선택</option>
                            <option value="1">박영희 (개발자) - AI 운동 추천 지원자</option>
                            <option value="2">정수진 (마케터) - 정산 자동화 지원자</option>
                            <option value="3">한미래 (운영자) - AI 챗봇 지원자</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Conditions Form -->
            <div class="bg-slate-900/50 rounded-xl p-6 border border-slate-800 mb-6">
                <h2 class="text-lg font-semibold mb-4">계약 조건</h2>

                <!-- Equity Distribution -->
                <div class="mb-6">
                    <h3 class="text-sm font-medium text-slate-400 mb-3">지분 배분</h3>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-slate-500 mb-2">갑 (본인) 지분</label>
                            <div class="relative">
                                <input type="number" value="60" min="0" max="100" class="w-full p-3 bg-slate-800/50 rounded-lg border border-slate-700 text-white focus:border-indigo-500 focus:outline-none pr-8">
                                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">%</span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm text-slate-500 mb-2">을 (파트너) 지분</label>
                            <div class="relative">
                                <input type="number" value="40" min="0" max="100" class="w-full p-3 bg-slate-800/50 rounded-lg border border-slate-700 text-white focus:border-indigo-500 focus:outline-none pr-8">
                                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">%</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Revenue Distribution -->
                <div class="mb-6">
                    <h3 class="text-sm font-medium text-slate-400 mb-3">수익 배분</h3>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-slate-500 mb-2">갑 (본인) 수익</label>
                            <div class="relative">
                                <input type="number" value="55" min="0" max="100" class="w-full p-3 bg-slate-800/50 rounded-lg border border-slate-700 text-white focus:border-indigo-500 focus:outline-none pr-8">
                                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">%</span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm text-slate-500 mb-2">을 (파트너) 수익</label>
                            <div class="relative">
                                <input type="number" value="45" min="0" max="100" class="w-full p-3 bg-slate-800/50 rounded-lg border border-slate-700 text-white focus:border-indigo-500 focus:outline-none pr-8">
                                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">%</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Duration -->
                <div class="mb-6">
                    <h3 class="text-sm font-medium text-slate-400 mb-3">계약 기간</h3>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-slate-500 mb-2">시작일</label>
                            <input type="date" class="w-full p-3 bg-slate-800/50 rounded-lg border border-slate-700 text-white focus:border-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-500 mb-2">종료일</label>
                            <input type="date" class="w-full p-3 bg-slate-800/50 rounded-lg border border-slate-700 text-white focus:border-indigo-500 focus:outline-none">
                        </div>
                    </div>
                    <div class="mt-3">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" checked class="w-4 h-4 rounded border-slate-700 bg-slate-800 text-indigo-500 focus:ring-indigo-500">
                            <span class="text-sm text-slate-400">계약 기간 종료 후 자동 연장 (1년 단위)</span>
                        </label>
                    </div>
                </div>

                <!-- Custom Clauses -->
                <div>
                    <h3 class="text-sm font-medium text-slate-400 mb-3">추가 조항</h3>
                    <textarea rows="4" placeholder="추가할 특별 조항이 있다면 입력하세요..." class="w-full p-3 bg-slate-800/50 rounded-lg border border-slate-700 text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none resize-none"></textarea>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-end gap-4">
                <button class="px-6 py-3 border border-slate-700 rounded-lg text-slate-300 hover:bg-slate-800 transition">
                    미리보기
                </button>
                <button class="px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-lg text-white hover:opacity-90 transition">
                    계약서 생성
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-8 px-6 border-t border-slate-800">
        <div class="max-w-6xl mx-auto">
            <div class="flex flex-col md:flex-row items-center justify-between">
                <div class="text-xl font-bold gradient-text mb-4 md:mb-0">MatchUp</div>
                <div class="flex items-center space-x-6 text-sm text-slate-500">
                    <a href="#" class="hover:text-white transition">이용약관</a>
                    <a href="#" class="hover:text-white transition">개인정보처리방침</a>
                    <a href="#" class="hover:text-white transition">문의하기</a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
