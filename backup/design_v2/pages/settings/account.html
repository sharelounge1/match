<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 설정 - MatchUp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen">
    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur-sm border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-lg mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="text-slate-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </a>
            <h1 class="text-lg font-semibold text-white">계정 설정</h1>
            <div class="w-6"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-lg mx-auto px-4 py-6">
        <!-- Email Section -->
        <section class="mb-6">
            <h2 class="text-sm font-medium text-slate-500 uppercase tracking-wider mb-3">이메일</h2>
            <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <p class="text-white font-medium">현재 이메일</p>
                        <p class="text-sm text-slate-400">user@example.com</p>
                    </div>
                    <span class="px-2 py-1 bg-green-500/20 text-green-400 text-xs rounded-full">인증됨</span>
                </div>
                <div class="space-y-3">
                    <input type="email" placeholder="새 이메일 주소" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none transition-colors">
                    <button class="w-full bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-medium py-3 rounded-lg hover:opacity-90 transition-opacity">
                        이메일 변경
                    </button>
                </div>
            </div>
        </section>

        <!-- Password Section -->
        <section class="mb-6">
            <h2 class="text-sm font-medium text-slate-500 uppercase tracking-wider mb-3">비밀번호</h2>
            <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4">
                <div class="space-y-3">
                    <input type="password" placeholder="현재 비밀번호" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none transition-colors">
                    <input type="password" placeholder="새 비밀번호" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none transition-colors">
                    <input type="password" placeholder="새 비밀번호 확인" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none transition-colors">
                    <button class="w-full bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-medium py-3 rounded-lg hover:opacity-90 transition-opacity">
                        비밀번호 변경
                    </button>
                </div>
            </div>
        </section>

        <!-- Social Login Section -->
        <section class="mb-6">
            <h2 class="text-sm font-medium text-slate-500 uppercase tracking-wider mb-3">소셜 로그인 연동</h2>
            <div class="bg-slate-900/50 border border-slate-800 rounded-xl divide-y divide-slate-800">
                <!-- Google -->
                <div class="p-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-white rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-white font-medium">Google</p>
                            <p class="text-xs text-slate-400">연동됨</p>
                        </div>
                    </div>
                    <button class="px-3 py-1.5 bg-slate-800 text-slate-400 text-sm rounded-lg hover:bg-slate-700 transition-colors">
                        연동 해제
                    </button>
                </div>

                <!-- Kakao -->
                <div class="p-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-yellow-400 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#3C1E1E">
                                <path d="M12 3C6.48 3 2 6.58 2 11c0 2.84 1.86 5.33 4.64 6.73-.2.74-.73 2.68-.84 3.09-.13.52.19.51.4.37.17-.11 2.62-1.78 3.69-2.51.7.1 1.41.15 2.11.15 5.52 0 10-3.58 10-8s-4.48-8-10-8z"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-white font-medium">카카오</p>
                            <p class="text-xs text-slate-400">연동 안됨</p>
                        </div>
                    </div>
                    <button class="px-3 py-1.5 bg-indigo-500/20 text-indigo-400 text-sm rounded-lg hover:bg-indigo-500/30 transition-colors">
                        연동하기
                    </button>
                </div>

                <!-- GitHub -->
                <div class="p-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-slate-800 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-white font-medium">GitHub</p>
                            <p class="text-xs text-slate-400">연동 안됨</p>
                        </div>
                    </div>
                    <button class="px-3 py-1.5 bg-indigo-500/20 text-indigo-400 text-sm rounded-lg hover:bg-indigo-500/30 transition-colors">
                        연동하기
                    </button>
                </div>
            </div>
        </section>

        <!-- Danger Zone -->
        <section>
            <h2 class="text-sm font-medium text-red-500 uppercase tracking-wider mb-3">위험 구역</h2>
            <div class="bg-slate-900/50 border border-red-500/30 rounded-xl p-4">
                <div class="mb-4">
                    <h3 class="text-white font-medium">계정 삭제</h3>
                    <p class="text-sm text-slate-400 mt-1">
                        계정을 삭제하면 모든 데이터가 영구적으로 삭제되며 복구할 수 없습니다.
                    </p>
                </div>
                <button class="w-full bg-red-500/20 text-red-400 font-medium py-3 rounded-lg hover:bg-red-500/30 transition-colors border border-red-500/30">
                    계정 삭제
                </button>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="max-w-lg mx-auto px-4 py-6 border-t border-slate-800 mt-8">
        <div class="flex justify-center gap-6 text-sm">
            <a href="../legal/terms.html" class="text-slate-500 hover:text-slate-300 transition-colors">이용약관</a>
            <a href="../legal/privacy.html" class="text-slate-500 hover:text-slate-300 transition-colors">개인정보처리방침</a>
            <a href="../legal/refund.html" class="text-slate-500 hover:text-slate-300 transition-colors">환불정책</a>
        </div>
    </footer>
</body>
</html>
