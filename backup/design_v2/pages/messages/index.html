<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메시지 - MatchUp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #818CF8 0%, #C084FC 50%, #F472B6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen">
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-lg border-b border-slate-800">
        <div class="max-w-lg mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-xl font-bold">메시지</h1>
                <button class="p-2 hover:bg-slate-800 rounded-lg transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-lg mx-auto px-4 py-4">
        <!-- Search -->
        <div class="relative mb-4">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input
                type="text"
                placeholder="대화 검색..."
                class="w-full bg-slate-900/50 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            >
        </div>

        <!-- Chat List -->
        <div class="space-y-2">
            <!-- Chat Item 1 - Unread -->
            <a href="chat.html?id=1" class="block bg-slate-900/50 border border-slate-800 rounded-xl p-4 hover:bg-slate-800/50 transition-colors">
                <div class="flex items-center gap-3">
                    <div class="relative flex-shrink-0">
                        <img
                            src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100&h=100&fit=crop&crop=face"
                            alt="김철수"
                            class="w-12 h-12 rounded-full object-cover"
                        >
                        <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-1">
                            <h3 class="font-semibold truncate">김철수</h3>
                            <span class="text-xs text-slate-400">방금 전</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <p class="text-sm text-slate-400 truncate">안녕하세요! AI 운동 추천 프로젝트에 관심이 있어서 연락드립니다.</p>
                            <span class="flex-shrink-0 ml-2 bg-indigo-500 text-white text-xs font-medium px-2 py-0.5 rounded-full">3</span>
                        </div>
                    </div>
                </div>
            </a>

            <!-- Chat Item 2 - Unread -->
            <a href="chat.html?id=2" class="block bg-slate-900/50 border border-slate-800 rounded-xl p-4 hover:bg-slate-800/50 transition-colors">
                <div class="flex items-center gap-3">
                    <div class="relative flex-shrink-0">
                        <img
                            src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop&crop=face"
                            alt="이영희"
                            class="w-12 h-12 rounded-full object-cover"
                        >
                        <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-1">
                            <h3 class="font-semibold truncate">이영희</h3>
                            <span class="text-xs text-slate-400">10분 전</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <p class="text-sm text-slate-400 truncate">미팅 일정 확인 부탁드립니다!</p>
                            <span class="flex-shrink-0 ml-2 bg-indigo-500 text-white text-xs font-medium px-2 py-0.5 rounded-full">1</span>
                        </div>
                    </div>
                </div>
            </a>

            <!-- Chat Item 3 - Read -->
            <a href="chat.html?id=3" class="block bg-slate-900/50 border border-slate-800 rounded-xl p-4 hover:bg-slate-800/50 transition-colors">
                <div class="flex items-center gap-3">
                    <div class="relative flex-shrink-0">
                        <img
                            src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop&crop=face"
                            alt="박지민"
                            class="w-12 h-12 rounded-full object-cover"
                        >
                        <span class="absolute bottom-0 right-0 w-3 h-3 bg-slate-500 border-2 border-slate-900 rounded-full"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-1">
                            <h3 class="font-semibold truncate">박지민</h3>
                            <span class="text-xs text-slate-400">1시간 전</span>
                        </div>
                        <p class="text-sm text-slate-400 truncate">네, 알겠습니다. 감사합니다!</p>
                    </div>
                </div>
            </a>

            <!-- Chat Item 4 - Read -->
            <a href="chat.html?id=4" class="block bg-slate-900/50 border border-slate-800 rounded-xl p-4 hover:bg-slate-800/50 transition-colors">
                <div class="flex items-center gap-3">
                    <div class="relative flex-shrink-0">
                        <img
                            src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&h=100&fit=crop&crop=face"
                            alt="최수연"
                            class="w-12 h-12 rounded-full object-cover"
                        >
                        <span class="absolute bottom-0 right-0 w-3 h-3 bg-slate-500 border-2 border-slate-900 rounded-full"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-1">
                            <h3 class="font-semibold truncate">최수연</h3>
                            <span class="text-xs text-slate-400">어제</span>
                        </div>
                        <p class="text-sm text-slate-400 truncate">계약서 초안 검토해주세요.</p>
                    </div>
                </div>
            </a>

            <!-- Chat Item 5 - Read -->
            <a href="chat.html?id=5" class="block bg-slate-900/50 border border-slate-800 rounded-xl p-4 hover:bg-slate-800/50 transition-colors">
                <div class="flex items-center gap-3">
                    <div class="relative flex-shrink-0">
                        <img
                            src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&h=100&fit=crop&crop=face"
                            alt="정민호"
                            class="w-12 h-12 rounded-full object-cover"
                        >
                        <span class="absolute bottom-0 right-0 w-3 h-3 bg-slate-500 border-2 border-slate-900 rounded-full"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-1">
                            <h3 class="font-semibold truncate">정민호</h3>
                            <span class="text-xs text-slate-400">3일 전</span>
                        </div>
                        <p class="text-sm text-slate-400 truncate">프로젝트 진행 상황 공유드립니다.</p>
                    </div>
                </div>
            </a>

            <!-- Chat Item 6 - Read -->
            <a href="chat.html?id=6" class="block bg-slate-900/50 border border-slate-800 rounded-xl p-4 hover:bg-slate-800/50 transition-colors">
                <div class="flex items-center gap-3">
                    <div class="relative flex-shrink-0">
                        <img
                            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=face"
                            alt="한소희"
                            class="w-12 h-12 rounded-full object-cover"
                        >
                        <span class="absolute bottom-0 right-0 w-3 h-3 bg-slate-500 border-2 border-slate-900 rounded-full"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-1">
                            <h3 class="font-semibold truncate">한소희</h3>
                            <span class="text-xs text-slate-400">1주일 전</span>
                        </div>
                        <p class="text-sm text-slate-400 truncate">디자인 시안 확인 부탁드려요!</p>
                    </div>
                </div>
            </a>
        </div>

        <!-- Empty State (hidden by default) -->
        <div class="hidden text-center py-16">
            <div class="w-20 h-20 bg-slate-900/50 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-10 h-10 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                </svg>
            </div>
            <h3 class="text-lg font-semibold mb-2">메시지가 없습니다</h3>
            <p class="text-slate-400 text-sm mb-6">프로젝트에 지원하거나 팀원을 찾아<br>대화를 시작해보세요.</p>
            <a href="../explore/index.html" class="inline-flex items-center gap-2 bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-medium px-6 py-3 rounded-xl hover:opacity-90 transition-opacity">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                프로젝트 탐색하기
            </a>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-lg border-t border-slate-800">
        <div class="max-w-lg mx-auto px-4">
            <div class="flex items-center justify-around py-3">
                <a href="../home/index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    <span class="text-xs">홈</span>
                </a>
                <a href="../explore/index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <span class="text-xs">탐색</span>
                </a>
                <a href="../projects/create.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
                    <div class="bg-gradient-to-r from-indigo-500 to-purple-500 p-2 rounded-xl">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                    </div>
                    <span class="text-xs">등록</span>
                </a>
                <a href="index.html" class="flex flex-col items-center gap-1 text-white transition-colors">
                    <div class="relative">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                        </svg>
                        <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-xs flex items-center justify-center rounded-full">4</span>
                    </div>
                    <span class="text-xs">메시지</span>
                </a>
                <a href="../profile/index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span class="text-xs">프로필</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Bottom padding for navigation -->
    <div class="h-20"></div>
</body>
</html>
