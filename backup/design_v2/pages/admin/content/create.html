                <a href="../payments/index.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-lg transition-colors">

        <!-- Main Content -->
        <main class="flex-1 ml-64">
            <!-- Header -->
            <header class="bg-slate-900/80 backdrop-blur-sm border-b border-slate-800 sticky top-0 z-40">
                <div class="px-8 py-4 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <a href="index.html" class="text-slate-400 hover:text-white transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                            </svg>
                        </a>
                        <h1 class="text-xl font-semibold text-white">새 콘텐츠 작성</h1>
                    </div>
                    <div class="flex items-center gap-4">
                        <button class="p-2 text-slate-400 hover:text-white transition-colors relative">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                            </svg>
                        </button>
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-full flex items-center justify-center">
                                <span class="text-sm font-medium text-white">A</span>
                            </div>
                            <span class="text-sm text-white">관리자</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="p-8">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Main Form -->
                    <div class="lg:col-span-2 space-y-6">
                        <!-- Content Type -->
                        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-6">
                            <label class="block text-sm font-medium text-white mb-3">콘텐츠 유형</label>
                            <div class="grid grid-cols-3 gap-3">
                                <label class="cursor-pointer">
                                    <input type="radio" name="content_type" value="notice" class="sr-only peer" checked>
                                    <div class="px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-center peer-checked:border-indigo-500 peer-checked:bg-indigo-500/10 transition-colors">
                                        <span class="text-sm text-slate-400 peer-checked:text-indigo-400">공지사항</span>
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="content_type" value="faq" class="sr-only peer">
                                    <div class="px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-center peer-checked:border-indigo-500 peer-checked:bg-indigo-500/10 transition-colors">
                                        <span class="text-sm text-slate-400 peer-checked:text-indigo-400">FAQ</span>
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="content_type" value="guide" class="sr-only peer">
                                    <div class="px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-center peer-checked:border-indigo-500 peer-checked:bg-indigo-500/10 transition-colors">
                                        <span class="text-sm text-slate-400 peer-checked:text-indigo-400">이용가이드</span>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- Title -->
                        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-6">
                            <label class="block text-sm font-medium text-white mb-3">제목</label>
                            <input type="text" placeholder="콘텐츠 제목을 입력하세요" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
                        </div>

                        <!-- Category (for FAQ) -->
                        <div id="faq-category" class="bg-slate-900/50 border border-slate-800 rounded-xl p-6 hidden">
                            <label class="block text-sm font-medium text-white mb-3">카테고리</label>
                            <select class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
                                <option value="">카테고리 선택</option>
                                <option value="account">계정</option>
                                <option value="payment">결제</option>
                                <option value="project">프로젝트</option>
                                <option value="contract">계약</option>
                                <option value="etc">기타</option>
                            </select>
                        </div>

                        <!-- Content Editor -->
                        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-6">
                            <label class="block text-sm font-medium text-white mb-3">내용</label>

                            <!-- Editor Toolbar -->
                            <div class="flex items-center gap-1 p-2 bg-slate-800 border border-slate-700 rounded-t-lg">
                                <button class="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16"/>
                                    </svg>
                                </button>
                                <button class="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded transition-colors font-bold">
                                    B
                                </button>
                                <button class="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded transition-colors italic">
                                    I
                                </button>
                                <button class="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded transition-colors underline">
                                    U
                                </button>
                                <div class="w-px h-6 bg-slate-700 mx-1"></div>
                                <button class="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
                                    </svg>
                                </button>
                                <button class="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                                    </svg>
                                </button>
                                <div class="w-px h-6 bg-slate-700 mx-1"></div>
                                <button class="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                                    </svg>
                                </button>
                                <button class="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                    </svg>
                                </button>
                            </div>

                            <!-- Textarea -->
                            <textarea class="w-full bg-slate-800 border border-slate-700 border-t-0 rounded-b-lg px-4 py-4 text-white focus:outline-none focus:border-indigo-500 resize-none" rows="15" placeholder="내용을 입력하세요...">안녕하세요, MatchUp 사용자 여러분.

2024년 1월 서비스 업데이트 내용을 안내드립니다.

## 주요 변경 사항

1. **실시간 채팅 기능 개선**
   - 이미지 및 파일 전송 기능 추가
   - 메시지 읽음 확인 기능 추가

2. **프로젝트 검색 필터 확장**
   - 지역별 필터 추가
   - 예상 기간별 필터 추가

3. **모바일 앱 성능 개선**
   - 앱 로딩 속도 40% 개선
   - 배터리 사용량 최적화

## 버그 수정

- 일부 기기에서 알림이 중복으로 표시되던 문제 수정
- 프로필 이미지 업로드 실패 문제 수정

문의사항이 있으시면 고객센터로 연락주시기 바랍니다.

감사합니다.
MatchUp 팀 드림</textarea>
                        </div>

                        <!-- Attachments -->
                        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-6">
                            <label class="block text-sm font-medium text-white mb-3">첨부파일</label>
                            <div class="border-2 border-dashed border-slate-700 rounded-lg p-8 text-center hover:border-slate-600 transition-colors">
                                <svg class="w-10 h-10 text-slate-500 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                                </svg>
                                <p class="text-slate-400 text-sm mb-2">파일을 드래그하여 업로드하거나</p>
                                <button class="px-4 py-2 bg-slate-800 text-slate-300 hover:text-white rounded-lg text-sm transition-colors">
                                    파일 선택
                                </button>
                                <p class="text-xs text-slate-500 mt-2">최대 10MB, PDF, JPG, PNG 지원</p>
                            </div>
                        </div>
                    </div>

                    <!-- Sidebar Options -->
                    <div class="space-y-6">
                        <!-- Publish Settings -->
                        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-6">
                            <h3 class="text-lg font-semibold text-white mb-4">게시 설정</h3>

                            <div class="space-y-4">
                                <label class="flex items-center gap-3 cursor-pointer">
                                    <input type="radio" name="publish" value="now" class="text-indigo-500 focus:ring-indigo-500 bg-slate-800 border-slate-700" checked>
                                    <div>
                                        <span class="text-white text-sm">즉시 게시</span>
                                        <p class="text-xs text-slate-500">저장 즉시 공개됩니다</p>
                                    </div>
                                </label>

                                <label class="flex items-center gap-3 cursor-pointer">
                                    <input type="radio" name="publish" value="scheduled" class="text-indigo-500 focus:ring-indigo-500 bg-slate-800 border-slate-700">
                                    <div>
                                        <span class="text-white text-sm">예약 게시</span>
                                        <p class="text-xs text-slate-500">지정한 시간에 공개됩니다</p>
                                    </div>
                                </label>

                                <!-- Schedule datetime (shown when scheduled is selected) -->
                                <div class="ml-6 mt-2">
                                    <input type="datetime-local" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-indigo-500">
                                </div>

                                <label class="flex items-center gap-3 cursor-pointer">
                                    <input type="radio" name="publish" value="draft" class="text-indigo-500 focus:ring-indigo-500 bg-slate-800 border-slate-700">
                                    <div>
                                        <span class="text-white text-sm">비공개 저장</span>
                                        <p class="text-xs text-slate-500">관리자만 볼 수 있습니다</p>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- Options -->
                        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-6">
                            <h3 class="text-lg font-semibold text-white mb-4">옵션</h3>

                            <div class="space-y-4">
                                <label class="flex items-center justify-between cursor-pointer">
                                    <span class="text-white text-sm">중요 공지로 표시</span>
                                    <input type="checkbox" class="w-5 h-5 rounded text-indigo-500 focus:ring-indigo-500 bg-slate-800 border-slate-700">
                                </label>

                                <label class="flex items-center justify-between cursor-pointer">
                                    <span class="text-white text-sm">댓글 허용</span>
                                    <input type="checkbox" class="w-5 h-5 rounded text-indigo-500 focus:ring-indigo-500 bg-slate-800 border-slate-700">
                                </label>

                                <label class="flex items-center justify-between cursor-pointer">
                                    <span class="text-white text-sm">푸시 알림 발송</span>
                                    <input type="checkbox" class="w-5 h-5 rounded text-indigo-500 focus:ring-indigo-500 bg-slate-800 border-slate-700" checked>
                                </label>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-6">
                            <div class="space-y-3">
                                <button class="w-full px-4 py-3 bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 text-white font-medium rounded-lg transition-colors">
                                    게시하기
                                </button>
                                <button class="w-full px-4 py-3 bg-slate-800 text-white hover:bg-slate-700 font-medium rounded-lg transition-colors flex items-center justify-center gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                    </svg>
                                    미리보기
                                </button>
                                <button class="w-full px-4 py-3 bg-slate-800/50 text-slate-400 hover:text-white font-medium rounded-lg transition-colors">
                                    임시 저장
                                </button>
                            </div>
                        </div>

                        <!-- Meta Info (for edit mode) -->
                        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-6">
                            <h3 class="text-lg font-semibold text-white mb-4">정보</h3>

                            <div class="space-y-3 text-sm">
                                <div class="flex justify-between">
                                    <span class="text-slate-400">작성자</span>
                                    <span class="text-white">관리자</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">작성일</span>
                                    <span class="text-white">-</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">최종 수정</span>
                                    <span class="text-white">-</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">조회수</span>
                                    <span class="text-white">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
