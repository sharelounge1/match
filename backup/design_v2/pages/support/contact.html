<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의하기 - MatchUp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen">
    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur-sm border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-lg mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="text-slate-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </a>
            <h1 class="text-lg font-semibold text-white">문의하기</h1>
            <div class="w-6"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-lg mx-auto px-4 py-6">
        <form class="space-y-6">
            <!-- Subject -->
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-2">문의 유형</label>
                <select class="w-full bg-slate-900/50 border border-slate-800 rounded-xl px-4 py-3 text-white focus:border-indigo-500 focus:outline-none transition-colors appearance-none cursor-pointer">
                    <option value="">문의 유형을 선택하세요</option>
                    <option value="account">계정 관련</option>
                    <option value="payment">결제 / 환불</option>
                    <option value="project">프로젝트 등록</option>
                    <option value="matching">매칭 관련</option>
                    <option value="contract">계약 관련</option>
                    <option value="bug">오류 신고</option>
                    <option value="suggestion">건의 사항</option>
                    <option value="other">기타</option>
                </select>
            </div>

            <!-- Title -->
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-2">제목</label>
                <input type="text" placeholder="문의 제목을 입력하세요" class="w-full bg-slate-900/50 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none transition-colors">
            </div>

            <!-- Message -->
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-2">내용</label>
                <textarea rows="6" placeholder="문의 내용을 자세히 작성해주세요" class="w-full bg-slate-900/50 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none transition-colors resize-none"></textarea>
            </div>

            <!-- File Attachment -->
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-2">파일 첨부 (선택)</label>
                <div class="bg-slate-900/50 border border-slate-800 border-dashed rounded-xl p-6 text-center cursor-pointer hover:border-indigo-500 transition-colors">
                    <input type="file" class="hidden" id="file-upload" multiple accept="image/*,.pdf,.doc,.docx">
                    <label for="file-upload" class="cursor-pointer">
                        <div class="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-3">
                            <svg class="w-6 h-6 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <p class="text-white text-sm font-medium mb-1">클릭하여 파일 첨부</p>
                        <p class="text-slate-500 text-xs">이미지, PDF, DOC 파일 (최대 10MB)</p>
                    </label>
                </div>
            </div>

            <!-- Contact Email -->
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-2">답변 받을 이메일</label>
                <input type="email" value="user@example.com" class="w-full bg-slate-900/50 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none transition-colors">
            </div>

            <!-- Notice -->
            <div class="bg-indigo-500/10 border border-indigo-500/20 rounded-xl p-4">
                <div class="flex gap-3">
                    <svg class="w-5 h-5 text-indigo-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <div>
                        <p class="text-sm text-slate-300">답변은 평일 기준 1-2일 내에 이메일로 발송됩니다.</p>
                        <p class="text-xs text-slate-500 mt-1">긴급한 문의는 채팅 상담을 이용해주세요.</p>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-medium py-3 rounded-xl hover:opacity-90 transition-opacity">
                문의 접수하기
            </button>
        </form>

        <!-- Previous Inquiries -->
        <section class="mt-8">
            <h2 class="text-sm font-medium text-slate-500 uppercase tracking-wider mb-3">이전 문의 내역</h2>
            <div class="space-y-3">
                <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4">
                    <div class="flex items-start justify-between mb-2">
                        <div>
                            <p class="text-white font-medium text-sm">결제 오류 문의</p>
                            <p class="text-xs text-slate-500">2024.01.15</p>
                        </div>
                        <span class="px-2 py-1 bg-green-500/20 text-green-400 text-xs rounded-full">답변 완료</span>
                    </div>
                    <p class="text-slate-400 text-sm truncate">카드 결제 시 오류가 발생하여...</p>
                </div>

                <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4">
                    <div class="flex items-start justify-between mb-2">
                        <div>
                            <p class="text-white font-medium text-sm">프로필 수정 문의</p>
                            <p class="text-xs text-slate-500">2024.01.10</p>
                        </div>
                        <span class="px-2 py-1 bg-green-500/20 text-green-400 text-xs rounded-full">답변 완료</span>
                    </div>
                    <p class="text-slate-400 text-sm truncate">프로필 사진을 변경하고 싶은데...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="max-w-lg mx-auto px-4 py-6 border-t border-slate-800 mt-8">
        <div class="flex justify-center gap-6 text-sm">
            <a href="../legal/terms.html" class="text-slate-500 hover:text-slate-300 transition-colors">이용약관</a>
            <a href="../legal/privacy.html" class="text-slate-500 hover:text-slate-300 transition-colors">개인정보처리방침</a>
            <a href="../legal/refund.html" class="text-slate-500 hover:text-slate-300 transition-colors">환불정책</a>
        </div>
    </footer>
</body>
</html>
