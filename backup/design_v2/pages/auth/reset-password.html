<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - MatchUp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #818CF8 0%, #C084FC 50%, #F472B6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen">
    <!-- Navigation -->
    <nav class="border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="../home/index.html" class="text-2xl font-bold gradient-text">MatchUp</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-800 mb-4">
                    <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">새 비밀번호 설정</h1>
                <p class="text-slate-400">
                    안전한 새 비밀번호를 설정하세요
                </p>
            </div>

            <!-- Reset Password Card -->
            <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-8">
                <form class="space-y-4">
                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-400 mb-2">
                            새 비밀번호
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="8자 이상 입력하세요"
                            class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        >
                        <p class="mt-2 text-sm text-slate-500">
                            영문, 숫자, 특수문자를 포함해 8자 이상
                        </p>
                    </div>

                    <div>
                        <label for="password-confirm" class="block text-sm font-medium text-slate-400 mb-2">
                            비밀번호 확인
                        </label>
                        <input
                            type="password"
                            id="password-confirm"
                            name="password-confirm"
                            placeholder="비밀번호를 다시 입력하세요"
                            class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        >
                    </div>

                    <!-- Password Strength Indicator -->
                    <div class="space-y-2">
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-400">비밀번호 강도</span>
                            <span class="text-yellow-400">보통</span>
                        </div>
                        <div class="h-2 bg-slate-700 rounded-full overflow-hidden">
                            <div class="h-full w-1/2 bg-gradient-to-r from-yellow-400 to-yellow-500 rounded-full"></div>
                        </div>
                    </div>

                    <button
                        type="submit"
                        class="w-full py-3 px-4 bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-semibold rounded-lg hover:from-indigo-600 hover:to-purple-600 transition-all"
                    >
                        비밀번호 변경
                    </button>
                </form>
            </div>

            <!-- Back to Login -->
            <p class="text-center mt-6 text-slate-400">
                비밀번호가 기억나셨나요?
                <a href="login.html" class="text-indigo-400 hover:text-indigo-300 font-medium">
                    로그인
                </a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <p class="text-slate-500 text-sm">
                    &copy; 2024 MatchUp. All rights reserved.
                </p>
                <div class="flex gap-6">
                    <a href="../legal/terms.html" class="text-slate-500 hover:text-slate-400 text-sm">
                        이용약관
                    </a>
                    <a href="../legal/privacy.html" class="text-slate-500 hover:text-slate-400 text-sm">
                        개인정보처리방침
                    </a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
