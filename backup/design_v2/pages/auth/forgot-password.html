<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 - MatchUp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #818CF8 0%, #C084FC 50%, #F472B6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen">
    <!-- Navigation -->
    <nav class="border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="../home/index.html" class="text-2xl font-bold gradient-text">MatchUp</a>
                <a href="login.html" class="text-slate-400 hover:text-white transition-colors">
                    로그인으로 돌아가기
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-800 mb-4">
                    <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">비밀번호를 잊으셨나요?</h1>
                <p class="text-slate-400">
                    걱정하지 마세요! 가입한 이메일 주소를 입력하시면<br>
                    비밀번호 재설정 링크를 보내드립니다.
                </p>
            </div>

            <!-- Forgot Password Card -->
            <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-8">
                <form class="space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-400 mb-2">
                            이메일 주소
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="name@example.com"
                            class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        >
                    </div>

                    <button
                        type="submit"
                        class="w-full py-3 px-4 bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-semibold rounded-lg hover:from-indigo-600 hover:to-purple-600 transition-all"
                    >
                        재설정 링크 보내기
                    </button>
                </form>
            </div>

            <!-- Back to Login -->
            <p class="text-center mt-6 text-slate-400">
                비밀번호가 기억나셨나요?
                <a href="login.html" class="text-indigo-400 hover:text-indigo-300 font-medium">
                    로그인
                </a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <p class="text-slate-500 text-sm">
                    &copy; 2024 MatchUp. All rights reserved.
                </p>
                <div class="flex gap-6">
                    <a href="../legal/terms.html" class="text-slate-500 hover:text-slate-400 text-sm">
                        이용약관
                    </a>
                    <a href="../legal/privacy.html" class="text-slate-500 hover:text-slate-400 text-sm">
                        개인정보처리방침
                    </a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
